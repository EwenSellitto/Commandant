syntax = "proto3";

package commandant.v1;

// ---------------------------------------------------------------------------
// Worker <-> Orchestrator. Workers dial in and keep this stream open.
// ---------------------------------------------------------------------------

service NodeLink {
  // The first WorkerMsg must be a Hello; the first reply is a Welcome.
  rpc Link(stream WorkerMsg) returns (stream OrchestratorMsg);
}

message NodeCredential {
  string node_id = 1;
  string secret = 2;
}

message Hello {
  oneof auth {
    string join_token = 1;           // first join
    NodeCredential credential = 2;   // reconnect with issued credentials
  }
  string name = 3;                   // defaults to hostname on first join
  string hostname = 4;
  string os = 5;
  string arch = 6;
  string version = 7;
  repeated string capabilities = 8;  // "exec", "harness:<name>"
}

message Heartbeat {}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
  OUTPUT_STREAM_REASONING = 3;       // agent tasks: the model's thinking
}

message TaskOutput {
  string task_id = 1;
  OutputStream stream = 2;
  bytes data = 3;
}

message TaskFinished {
  string task_id = 1;
  optional int32 exit_code = 2;      // unset when killed by a signal or never started
  string error = 3;
  bool cancelled = 4;
  string session_id = 5;             // agent tasks: the session to continue
  string model = 6;                  // agent tasks: the "provider/model" that replied
  AgentUsage usage = 7;              // agent tasks: what the turn cost
}

// Tokens and cost of one agent turn, summed over its model calls.
message AgentUsage {
  uint64 input = 1;
  uint64 output = 2;
  uint64 reasoning = 3;
  uint64 cache_read = 4;
  uint64 cache_write = 5;
  double cost = 6;                   // in US dollars, as the harness reckons it
  uint64 context = 7;                // tokens in the context after the turn
}

// What a node's agent harness offers, in answer to ListAgentOptions.
message AgentOptions {
  string request_id = 1;
  repeated AgentChoice agents = 2;   // the ones a prompt can use
  repeated ModelChoice models = 3;   // from the providers the node has set up
  string default_agent = 4;
  string default_model = 5;          // empty when the harness decides per prompt
  string error = 6;                  // set when the harness couldn't answer
  repeated AgentCommand commands = 7; // what a prompt's `command` can name
  repeated McpServer mcp_servers = 8;
}

// A command the agent runs on a prompt: its own, a skill, or an MCP prompt.
message AgentCommand {
  string name = 1;
  string description = 2;
  string source = 3;                 // command | skill | mcp
}

// An MCP server the agent's tools come from.
message McpServer {
  string name = 1;
  string status = 2;                 // connected | disabled | failed | needs_auth | ...
  string error = 3;
}

message AgentChoice {
  string name = 1;
  string description = 2;
}

message ModelChoice {
  string id = 1;                     // "provider/model"
  string name = 2;
  string provider = 3;               // display name
  repeated string variants = 4;      // thinking efforts, e.g. "low", "high"
  uint64 context = 5;                // context window in tokens; 0 = unknown
}

message WorkerMsg {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    TaskOutput output = 3;
    TaskFinished finished = 4;
    AgentOptions options = 10;
    AgentSessions sessions = 11;
  }
  reserved 12 to 19; // agent events
}

message Welcome {
  string node_id = 1;
  string node_secret = 2;            // only set on first join; persist it
}

message RunTask {
  string task_id = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
}

message CancelTask {
  string task_id = 1;
}

// Sends a prompt to the node's agent harness. The reply streams back as
// TaskOutput: the agent's text on stdout, its tool activity on stderr.
message AgentPrompt {
  string task_id = 1;
  string prompt = 2;
  string session_id = 3;             // continue this session; empty = new one
  string cwd = 4;                    // empty = the session's, or the worker's
  string model = 5;                  // "provider/model"; empty = harness default
  string agent = 6;                  // empty = harness default
  string variant = 7;                // thinking effort; empty = the model's default
  string command = 8;                // run this command, the prompt being its arguments
}

// Asks the node's agent harness for its AgentOptions, after connecting or
// disconnecting an MCP server if `mcp` is set.
message ListAgentOptions {
  string request_id = 1;
  McpSwitch mcp = 2;
}

message McpSwitch {
  string name = 1;
  bool connect = 2;
}

// Asks the node's agent harness for its saved sessions.
message ListAgentSessions {
  string request_id = 1;
}

// A node's saved agent sessions, most recently updated first.
message AgentSessions {
  string request_id = 1;
  repeated AgentSession sessions = 2;
  string error = 3;                  // set when the harness couldn't answer
}

message AgentSession {
  string id = 1;
  string title = 2;
  string directory = 3;
  int64 updated = 4;                 // unix seconds
  bool busy = 5;                     // a prompt is running in it on this node
  string agent = 6;                  // what it last used, if known
  string model = 7;                  // "provider/model"
  string variant = 8;
  double cost = 9;                   // US dollars so far
}

message OrchestratorMsg {
  oneof msg {
    Welcome welcome = 1;
    RunTask run = 2;
    CancelTask cancel = 3;
    AgentPrompt prompt = 10;
    ListAgentOptions list_options = 11;
    ListAgentSessions list_sessions = 12;
  }
  reserved 13 to 19; // agent control
}

// ---------------------------------------------------------------------------
// CLI -> Orchestrator. Requires `authorization: Bearer <admin token>`.
// ---------------------------------------------------------------------------

service Control {
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  rpc RunCommand(RunCommandRequest) returns (stream TaskEvent);
  rpc Prompt(PromptRequest) returns (stream TaskEvent);
  rpc GetAgentOptions(GetAgentOptionsRequest) returns (AgentOptions);
  // Connects or disconnects an MCP server; answers with the new options.
  rpc SwitchMcpServer(SwitchMcpServerRequest) returns (AgentOptions);
  rpc ListAgentSessions(ListAgentSessionsRequest) returns (AgentSessions);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
}

message CreateJoinTokenRequest {
  uint64 ttl_secs = 1;               // 0 = never expires
  bool reusable = 2;
}

message CreateJoinTokenResponse {
  string token = 1;
  optional int64 expires_at = 2;
}

message NodeInfo {
  string id = 1;
  string name = 2;
  string hostname = 3;
  string os = 4;
  string arch = 5;
  string version = 6;
  bool online = 7;
  int64 last_seen = 8;
  int64 created_at = 9;
  repeated string harnesses = 10;    // agent harnesses, while online
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated NodeInfo nodes = 1;
}

message RemoveNodeRequest {
  string node = 1;                   // id, id prefix or name
}

message RemoveNodeResponse {}

message RunCommandRequest {
  string node = 1;                   // id, id prefix or name
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
}

message PromptRequest {
  string node = 1;                   // id, id prefix or name
  string prompt = 2;
  string session_id = 3;
  string cwd = 4;
  string model = 5;
  string agent = 6;
  string variant = 7;
  string command = 8;                // an AgentOptions command; the prompt is its arguments
}

message GetAgentOptionsRequest {
  string node = 1;                   // id, id prefix or name
}

message ListAgentSessionsRequest {
  string node = 1;                   // id, id prefix or name
}

message SwitchMcpServerRequest {
  string node = 1;                   // id, id prefix or name
  string name = 2;
  bool connect = 3;                  // false disconnects
}

message TaskStarted {
  string task_id = 1;
  string node_id = 2;
}

message TaskEvent {
  oneof event {
    TaskStarted started = 1;
    TaskOutput output = 2;
    TaskFinished finished = 3;
  }
}

message TaskInfo {
  string id = 1;
  string node_id = 2;
  string node_name = 3;
  repeated string argv = 4;
  string status = 5;                 // running | succeeded | failed | cancelled | lost
  optional int32 exit_code = 6;
  string error = 7;
  int64 created_at = 8;
  optional int64 finished_at = 9;
}

message ListTasksRequest {
  uint32 limit = 1;
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {}
