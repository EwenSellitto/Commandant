[package]
name = "commandant-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "commandant"
path = "src/main.rs"

[features]
# The desktop GUI, off by default: GPUI is long to build and needs desktop
# libraries. Without it the client is the CLI and TUI only.
gui =["dep:gpui", "dep:gpui-component", "dep:gpui-kit-assets", "dep:gpui-platform", "dep:serde", "dep:toml"]
# The GUI's tests that open a window, on GPUI's test platform: kept out of
# `gui` so its builds don't carry GPUI's test support.
gui-tests = ["gui", "gpui/test-support"]

[dependencies]
anyhow.workspace = true
commandant-client-core.workspace = true
commandant-common.workspace = true
clap.workspace = true
commandant-proto.workspace = true
crossterm.workspace = true
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
gpui-kit-assets = { workspace = true, optional = true }
gpui-platform = { workspace = true, optional = true }
ratatui.workspace = true
serde = { workspace = true, optional = true }
tokio.workspace = true
tokio-stream.workspace = true
toml = { workspace = true, optional = true }
tonic.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
commandant-client-core = { workspace = true, features = ["test-support"] }
