[package]
name = "commandant-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "commandant"
path = "src/main.rs"

[features]
default = ["gui"]
# The desktop GUI; off, the client is the CLI and TUI only, for headless
# machines (GPUI is long to build and needs desktop libraries).
gui = ["dep:gpui", "dep:gpui-component", "dep:gpui-platform", "dep:serde", "dep:toml"]

[dependencies]
anyhow.workspace = true
commandant-client-core.workspace = true
commandant-common.workspace = true
clap.workspace = true
commandant-proto.workspace = true
crossterm.workspace = true
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
gpui-platform = { workspace = true, optional = true }
ratatui.workspace = true
serde = { workspace = true, optional = true }
tokio.workspace = true
tokio-stream.workspace = true
toml = { workspace = true, optional = true }
tonic.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true
commandant-client-core = { workspace = true, features = ["test-support"] }
