# A worker joining an orchestrator, with a worker-only link from
# `commandant token create`:
#
#   COMMANDANT_LINK='commandant://...' docker compose -f docker/worker.compose.yml up -d --build
#
# Not the admin link `commandant-server serve` printed: what the worker runs,
# its agent included, could read it from the container, and it controls the
# whole cluster. A worker-only link joins one worker, then is worthless.
#
# The link is only needed on the first start; credentials are kept in the
# volume. A node removed with `commandant node rm` stays removed: the worker
# stops at every restart. To join again as a new node, delete the state
# volume (`docker volume rm <project>_state`, once the container is down) and
# start it with a new link. For several workers on one host, give each its own project name (and
# optionally a node name):
#
#   COMMANDANT_LINK='commandant://...' COMMANDANT_NODE_NAME=box-2b \
#     docker compose -p box-2b -f docker/worker.compose.yml up -d
#
# The worker runs as the image's `commandant` user, never root. Volumes from
# an older image, made by root, need `chown -R 1000:1000` on the host first.
#
# To host a coding agent, add COMMANDANT_HARNESS=opencode. It is installed on
# the first start and kept, with its sessions and logins, in the home volume.
# Give it a model provider by passing its API key, e.g. ANTHROPIC_API_KEY, in
# `environment` below.

name: commandant-worker

services:
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${COMMANDANT_IMAGE:-commandant:dev}
    command: ["worker"]
    # Passed through only when set in your shell.
    environment: [COMMANDANT_LINK, COMMANDANT_NODE_NAME, COMMANDANT_HARNESS]
    volumes: [state:/state, home:/home/commandant]
    restart: unless-stopped

volumes:
  state:
  home:
