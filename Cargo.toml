[workspace]
resolver = "3"
members = ["crates/*"]
# Tools keep caches here (fallow); they aren't crates.
exclude = ["crates/.fallow"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
commandant-client-core = { path = "crates/commandant-client-core" }
commandant-common = { path = "crates/commandant-common" }
commandant-proto = { path = "crates/commandant-proto" }
commandant-orchestrator = { path = "crates/commandant-orchestrator" }
commandant-worker = { path = "crates/commandant-worker" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
directories = "6.0.0"
getrandom = "0.4.3"
# GPUI snapshots publish weekly and break freely: pinned exactly, bumped in
# lockstep with gpui-component.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui-component = "=0.7.1"
# The icons gpui-component draws, released with it.
gpui-kit-assets = "=0.7.1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
# libgit2 built from source; OpenSSL and libssh2 from the system (pkg-config).
git2 = { version = "0.21", default-features = false, features = ["https", "ssh", "vendored-libgit2"] }
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.189"
prost = "0.14.4"
protoc-bin-vendored = "3.2.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# TLS on ring, which builds on Windows without extra tools.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "signal", "net", "time", "sync", "io-util", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1.1.6"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
uuid = { version = "1.26.1", features = ["v4"] }

# The house Rust rules (rust-dev skill) that a lint can check.
[workspace.lints.rust]
# missing_docs = "warn"  # on once every public item has its doc

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
# missing_errors_doc = "warn"  # on once every fallible fn says when it fails
missing_panics_doc = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
ref_patterns = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
use_self = "warn"
wildcard_imports = "warn"
