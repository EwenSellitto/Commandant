[package]
name = "commandant-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5", features = ["derive"] }
commandant-core = { workspace = true }
commandant-docker-compose = { path = "../commandant-docker-compose" }
crossterm = "0.28"
ratatui = "0.29"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "signal"] }
