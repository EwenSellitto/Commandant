# Local dev cluster: one orchestrator and two workers, which join through the
# connection link the orchestrator writes to its data volume.
#
#   docker compose up -d --build
#   commandant login "$(docker compose exec server cat /data/link)"
#   commandant node ls
#
# The link lists 127.0.0.1 first, for the client on this machine, then
# `server`, for the workers on the compose network.

x-worker: &worker
  image: commandant:dev
  # The link is only there once the server has started. It holds the admin
  # token, as does the volume it is read from: fine for a dev cluster on one
  # host, not for workers you trust less.
  init: true
  entrypoint: ["sh", "-c"]
  command:
    - until [ -s /server/link ]; do sleep 1; done;
      COMMANDANT_LINK="$(cat /server/link)" exec commandant-server worker
  depends_on: [server]
  restart: unless-stopped

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: commandant:dev
    command: ["serve", "--listen", "0.0.0.0:7400", "--advertise", "127.0.0.1,server"]
    ports: ["7400:7400"]
    volumes: [server-data:/data]
    restart: unless-stopped

  worker-1:
    <<: *worker
    environment:
      COMMANDANT_NODE_NAME: worker-1
    volumes: [server-data:/server:ro, worker-1-state:/state]

  worker-2:
    <<: *worker
    environment:
      COMMANDANT_NODE_NAME: worker-2
    volumes: [server-data:/server:ro, worker-2-state:/state]

volumes:
  server-data:
  worker-1-state:
  worker-2-state:
